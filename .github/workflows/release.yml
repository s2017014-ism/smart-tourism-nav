name: Build releases

# 於發布 Release 時，在對應系統的 runner 上建置各平台，
# 並將「後端原始碼 + 啟動腳本 + 使用說明」一併打包，
# 最後自動附加到該 Release。
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.47.5"
  APP_NAME: smart-tourism-nav

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build APK
        working-directory: frontend
        run: |
          flutter pub get
          flutter build apk --release
      - name: Rename
        run: cp frontend/build/app/outputs/flutter-apk/app-release.apk ${{ env.APP_NAME }}-android.apk
      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: ${{ env.APP_NAME }}-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ env.APP_NAME }}-android.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build Windows
        working-directory: frontend
        run: |
          flutter pub get
          flutter build windows --release
      - name: Assemble package (app + backend + launcher)
        shell: pwsh
        run: |
          $pkg = "pkg-windows"
          if (Test-Path $pkg) { Remove-Item -Recurse -Force $pkg }
          New-Item -ItemType Directory -Force $pkg | Out-Null
          Copy-Item -Recurse "frontend/build/windows/x64/runner/Release/*" $pkg
          New-Item -ItemType Directory -Force "$pkg/backend" | Out-Null
          Copy-Item -Recurse "backend/app" "$pkg/backend/"
          Copy-Item -Recurse "backend/scripts" "$pkg/backend/"
          Copy-Item "backend/requirements.txt" "$pkg/backend/"
          Copy-Item "backend/.env.example" "$pkg/backend/"
          New-Item -ItemType Directory -Force "$pkg/backend/data" | Out-Null
          Copy-Item "backend/data/*.json" "$pkg/backend/data/"
          Copy-Item "backend/data/*.geojson" "$pkg/backend/data/"
          New-Item -ItemType Directory -Force "$pkg/backend/data/cache" | Out-Null
          Copy-Item "backend/data/cache/*.graphml" "$pkg/backend/data/cache/" -ErrorAction SilentlyContinue
          Copy-Item "launcher/start-backend.bat" $pkg
          Copy-Item "launcher/使用說明.txt" $pkg
          # 確保 .bat 為 CRLF（cmd 需要）
          $bat = Join-Path $pkg "start-backend.bat"
          $c = ([IO.File]::ReadAllText($bat) -replace "`r`n", "`n") -replace "`n", "`r`n"
          [IO.File]::WriteAllText($bat, $c, [Text.Encoding]::ASCII)
      - name: Zip
        shell: pwsh
        run: |
          Compress-Archive -Path "pkg-windows/*" `
            -DestinationPath ${{ env.APP_NAME }}-windows-x64.zip -Force
      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: ${{ env.APP_NAME }}-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: ${{ env.APP_NAME }}-windows-x64.zip

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build Linux
        working-directory: frontend
        run: |
          flutter pub get
          flutter build linux --release
      - name: Assemble package (app + backend + launcher)
        run: |
          rm -rf pkg-linux && mkdir -p pkg-linux
          cp -r frontend/build/linux/x64/release/bundle/* pkg-linux/
          mkdir -p pkg-linux/backend/data
          cp -r backend/app pkg-linux/backend/
          cp -r backend/scripts pkg-linux/backend/
          cp backend/requirements.txt backend/.env.example pkg-linux/backend/
          cp backend/data/*.json backend/data/*.geojson pkg-linux/backend/data/
          mkdir -p pkg-linux/backend/data/cache
          cp backend/data/cache/*.graphml pkg-linux/backend/data/cache/ 2>/dev/null || true
          cp launcher/start-backend.sh pkg-linux/
          chmod +x pkg-linux/start-backend.sh
          cp "launcher/使用說明.txt" pkg-linux/
      - name: Package
        run: |
          tar -czf ${{ env.APP_NAME }}-linux-x64.tar.gz -C pkg-linux .
      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: ${{ env.APP_NAME }}-linux-x64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: linux-targz
          path: ${{ env.APP_NAME }}-linux-x64.tar.gz

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build macOS
        working-directory: frontend
        run: |
          flutter pub get
          flutter build macos --release
      - name: Assemble package (app + backend + launcher)
        run: |
          rm -rf pkg-macos && mkdir -p pkg-macos
          cp -r frontend/build/macos/Build/Products/Release/*.app pkg-macos/
          mkdir -p pkg-macos/backend/data
          cp -r backend/app pkg-macos/backend/
          cp -r backend/scripts pkg-macos/backend/
          cp backend/requirements.txt backend/.env.example pkg-macos/backend/
          cp backend/data/*.json backend/data/*.geojson pkg-macos/backend/data/
          mkdir -p pkg-macos/backend/data/cache
          cp backend/data/cache/*.graphml pkg-macos/backend/data/cache/ 2>/dev/null || true
          cp launcher/start-backend.sh launcher/start-backend.command pkg-macos/
          chmod +x pkg-macos/start-backend.sh pkg-macos/start-backend.command
          cp "launcher/使用說明.txt" pkg-macos/
      - name: Zip
        run: |
          cd pkg-macos
          zip -r -y "../${{ env.APP_NAME }}-macos.zip" .
      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: ${{ env.APP_NAME }}-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos-zip
          path: ${{ env.APP_NAME }}-macos.zip
